<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#04070e}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:
      radial-gradient(ellipse 1050px 720px at 50% 44%, rgba(90,150,230,0.17) 0%, rgba(90,150,230,0) 62%),
      radial-gradient(ellipse 700px 900px at 6% 90%, rgba(70,120,200,0.10) 0%, rgba(70,120,200,0) 60%),
      linear-gradient(165deg,#0b1c33 0%,#102a48 34%,#123254 52%,#0c1e39 76%,#071223 100%)}
  .grid-fine{position:absolute;inset:0;background-image:
    linear-gradient(rgba(150,195,240,0.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,195,240,0.055) 1px,transparent 1px);background-size:32px 32px}
  .grid-bold{position:absolute;inset:0;background-image:
    linear-gradient(rgba(150,195,240,0.10) 1.5px,transparent 1.5px),
    linear-gradient(90deg,rgba(150,195,240,0.10) 1.5px,transparent 1.5px);background-size:160px 160px}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 1500px 1000px at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,0.62) 100%)}
  svg{position:absolute;inset:0}
  text{font-family:"Microsoft YaHei","微软雅黑",sans-serif}
</style>
</head>
<body>
<div id="stage">
  <div class="grid-fine"></div><div class="grid-bold"></div>
  <svg id="svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
  <div class="vig"></div>
</div>
<script>
const clamp01=v=>v<0?0:v>1?1:v;
const easeOut=p=>1-Math.pow(1-p,3);
const easeInOut=p=>p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const seg=(t,a,b)=>clamp01((t-a)/(b-a));
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg");
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

// 先修关系 DAG
const N=[
  {x:400, y:520, r:22, name:"基础概念", on:true},
  {x:760, y:360, r:20, name:"滑动窗口", on:true},
  {x:760, y:690, r:20, name:"三次握手", on:false},
  {x:1120,y:520, r:22, name:"拥塞控制", on:true},
  {x:1480,y:360, r:20, name:"慢启动",   on:true},
  {x:1480,y:690, r:20, name:"快重传",   on:false},
];
const E=[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5]];
const PATH=[0,1,3,4];

const gE=el("g",{});svg.appendChild(gE);
const edgeEls=E.map(([i,j])=>{
  const a=N[i],b=N[j];
  const len=Math.hypot(b.x-a.x,b.y-a.y);
  const ln=el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"rgba(127,224,200,0.75)","stroke-width":1.8,"stroke-dasharray":"13 9",opacity:0});
  gE.appendChild(ln);
  return {ln,len,on:PATH.includes(i)&&PATH.includes(j)};
});
// 路径高亮线
const gP=el("g",{});svg.appendChild(gP);
const pathLines=[];
for(let k=0;k<PATH.length-1;k++){
  const a=N[PATH[k]],b=N[PATH[k+1]];
  const len=Math.hypot(b.x-a.x,b.y-a.y);
  const ln=el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#f0c874","stroke-width":3.4,"stroke-linecap":"round",opacity:0});
  gP.appendChild(ln);pathLines.push({ln,len});
}
const gN=el("g",{});svg.appendChild(gN);
const nodeEls=N.map(n=>{
  const halo=el("circle",{cx:n.x,cy:n.y,r:n.r*3.2,fill:"#f0c874",opacity:0,filter:"blur(8px)"});
  const dot=el("circle",{cx:n.x,cy:n.y,r:n.r,fill:n.on?"rgba(16,40,68,0.95)":"rgba(16,40,68,0.95)",stroke:"rgba(150,195,240,0.6)","stroke-width":2});
  const t=el("text",{x:n.x,y:n.y+n.r+34,"text-anchor":"middle",fill:"rgba(200,222,246,0.82)","font-size":21,"letter-spacing":3});
  t.textContent=n.name;
  gN.appendChild(halo);gN.appendChild(dot);gN.appendChild(t);
  return {halo,dot,t};
});
// 序号 + 标签
const gTag=el("g",{opacity:0});svg.appendChild(gTag);
const tag=el("text",{x:400,y:206,fill:"rgba(232,196,116,0.95)","font-size":24,"letter-spacing":8});
tag.textContent="推荐学习路径 · 基于先修关系";
gTag.appendChild(tag);
// 步骤序号
const stepEls=PATH.map((ni,k)=>{
  const n=N[ni];
  const g=el("g",{opacity:0});
  const c=el("circle",{cx:n.x+n.r+22,cy:n.y-n.r-20,r:17,fill:"#e6bd63"});
  const t=el("text",{x:n.x+n.r+22,y:n.y-n.r-13,"text-anchor":"middle",fill:"#0b1c33","font-size":20,"font-weight":700});
  t.textContent=String(k+1);
  g.appendChild(c);g.appendChild(t);gTag.parentNode.appendChild(g);
  return g;
});

function draw(t){
  const na=easeOut(seg(t,0.05,0.85));
  nodeEls.forEach((e,i)=>{
    const a=easeOut(seg(t,0.05+i*0.07,0.6+i*0.07));
    e.dot.setAttribute("opacity",a.toFixed(3));
    e.t.setAttribute("opacity",(a*na*0.95).toFixed(3));
    e.dot.setAttribute("r",(N[i].r*a).toFixed(2));
  });
  // 先修边
  edgeEls.forEach((e,i)=>{
    const g=easeOut(seg(t,0.75+i*0.09,1.5+i*0.09));
    e.ln.setAttribute("opacity",(g*(e.on?0.5:0.8)).toFixed(3));
  });
  // 路径逐步点亮
  for(let k=0;k<PATH.length-1;k++){
    const st=1.7+k*0.42;
    const g=easeOut(seg(t,st,st+0.42));
    pathLines[k].ln.setAttribute("opacity",g.toFixed(3));
    pathLines[k].ln.setAttribute("stroke-dasharray",pathLines[k].len.toFixed(1));
    pathLines[k].ln.setAttribute("stroke-dashoffset",(pathLines[k].len*(1-g)).toFixed(1));
  }
  PATH.forEach((ni,k)=>{
    const n=N[ni];
    const on=easeOut(seg(t,1.62+k*0.42,2.05+k*0.42));
    nodeEls[ni].dot.setAttribute("fill",on>0.5?"rgba(240,200,116,0.95)":"rgba(16,40,68,0.95)");
    nodeEls[ni].dot.setAttribute("stroke",on>0.5?"#f0c874":"rgba(150,195,240,0.6)");
    nodeEls[ni].halo.setAttribute("opacity",(on*0.3*(0.7+0.3*Math.sin(t*3+k))).toFixed(3));
    nodeEls[ni].halo.setAttribute("r",(n.r*3.2).toFixed(1));
    stepEls[k].setAttribute("opacity",on.toFixed(3));
  });
  gTag.setAttribute("opacity",(easeOut(seg(t,3.15,3.8))*0.98).toFixed(3));
}
window.__seek=t=>draw(t);
window.__ready=true;
window.__seek(0);
</script>
</body>
</html>
