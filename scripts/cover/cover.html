<!DOCTYPE html>

<style>

  html, body {
    width: 1654px;
    height: 2339px;
    overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;

  /* ═════════ 底色：多层大气透视 ═════════ */
  .cover {
    position: relative;
    width: 1654px;
    height: 2339px;
    background:
      /* 顶部光源 */
      radial-gradient(ellipse 900px 600px at 50% 8%, rgba(180,210,250,0.14) 0%, rgba(180,210,250,0) 50%),
      /* 左侧暖光 */
      radial-gradient(ellipse 500px 800px at 12% 45%, rgba(200,170,120,0.07) 0%, rgba(200,170,120,0) 50%),
      /* 右下冷光 */
      radial-gradient(ellipse 600px 700px at 88% 75%, rgba(80,130,200,0.10) 0%, rgba(80,130,200,0) 50%),
      /* 底部暗角 */
      radial-gradient(ellipse 1400px 500px at 50% 100%, rgba(0,8,25,0.45) 0%, rgba(0,8,25,0) 65%),
      /* 主渐变 */
      linear-gradient(165deg, #0d2138 0%, #122c4a 28%, #163560 50%, #0e2342 78%, #0a1830 100%);
    overflow: hidden;

  /* ═════════ 工程网格（细+粗+透视感） ═════════ */
  .grid-fine {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(160,200,240,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(160,200,240,0.07) 1px, transparent 1px);
    background-size: 33px 33px;
  }
  .grid-bold {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(160,200,240,0.12) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(160,200,240,0.12) 1.5px, transparent 1.5px);
    background-size: 165px 165px;
  }
  /* 网格中心淡出效果 */
  .grid-mask {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 1100px 1000px at 50% 48%, rgba(10,24,48,0.55) 0%, rgba(10,24,48,0) 55%);

  /* ═════════ 纸张纤维质感 ═════════ */
  .grain {
    position: absolute; inset: 0;
    opacity: 0.6;
    mix-blend-mode: overlay;
    background-image:

      radial-gradient(circle at 72% 8%, rgba(255,255,255,0.05) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 28% 62%, rgba(0,0,0,0.07) 0 2px, transparent 3px),
      radial-gradient(circle at 85% 68%, rgba(0,0,0,0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 48% 38%, rgba(255,255,255,0.04) 0 1px, transparent 2px),
      radial-gradient(circle at 62% 82%, rgba(0,0,0,0.05) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 15% 88%, rgba(255,255,255,0.03) 0 1px, transparent 2px);

  /* ═════════ 顶部装饰檐口 ═════════ */

    pointer-events: none;
  }
  .frame::after {
    content: ""; position: absolute; inset: 14px;
    border: 1px solid rgba(212,175,95,0.15);
  }
  .corner {
    position: absolute; width: 52px; height: 52px;
    border-color: rgba(224,190,110,0.65);
  }
  .corner.tl { top: 42px; left: 42px; border-top: 3px solid; border-left: 3px solid; }
  .corner.tr { top: 42px; right: 42px; border-top: 3px solid; border-right: 3px solid; }
  .corner.bl { bottom: 42px; left: 42px; border-bottom: 3px solid; border-left: 3px solid; }
  .corner.br { bottom: 42px; right: 42px; border-bottom: 3px solid; border-right: 3px solid; }
  /* 角部装饰花纹 */
  .corner-orn {
    position: absolute; width: 80px; height: 80px;
    opacity: 0.25;
  }

  .corner-orn.tr { top: 42px; right: 42px; transform: scaleX(-1); }
  .corner-orn.bl { bottom: 42px; left: 42px; transform: scaleY(-1); }
  .corner-orn.br { bottom: 42px; right: 42px; transform: scale(-1,-1); }

  .head { position: absolute; top: 240px; left: 0; right: 0; text-align: center; z-index: 10; }

</style>
</head>

const NS = "http://www.w3.org/2000/svg";

const W = 1200, H = 940;

function el(tag, attrs) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

// 伪随机
let seed = 20260810;
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

// 贝塞尔曲线路径生成
function bezierPath(x1, y1, x2, y2, curvature) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  // 垂直方向偏移控制点
  const nx = -dy / dist, ny = dx / dist;
  const offset = dist * curvature * (rnd() - 0.5) * 2;
  const cx = mx + nx * offset, cy = my + ny * offset;
  return `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
}

  <!-- 金色光晕 -->
  <radialGradient id="haloGold" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.65"/>
    <stop offset="50%" stop-color="#e2b45c" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#b8892f" stop-opacity="0"/>
  </radialGradient>
  <!-- 蓝色节点渐变（更立体） -->
  <radialGradient id="nodeBlue" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#f0f8ff"/>
    <stop offset="30%" stop-color="#b8ddf5"/>
    <stop offset="65%" stop-color="#6eb0db"/>
    <stop offset="100%" stop-color="#3a7ba0"/>
  </radialGradient>
  <!-- 金色节点渐变（更立体） -->
  <radialGradient id="nodeGold" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#fff8e0"/>
    <stop offset="30%" stop-color="#f5d98a"/>
    <stop offset="65%" stop-color="#d4a548"/>
    <stop offset="100%" stop-color="#a07820"/>
  </radialGradient>
  <!-- 节点描边渐变 -->
  <linearGradient id="strokeBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(220,240,255,0.9)"/>
    <stop offset="100%" stop-color="rgba(120,180,230,0.4)"/>
  </linearGradient>
  <linearGradient id="strokeGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(255,248,224,0.95)"/>
    <stop offset="100%" stop-color="rgba(200,160,80,0.5)"/>
  </linearGradient>
  <!-- 模糊滤镜（远景层） -->
  <filter id="blurFar" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <!-- 节点发光滤镜 -->
  <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <!-- 中心脉冲圈 -->
  <radialGradient id="pulseRing" cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#d4af5f" stop-opacity="0"/>
    <stop offset="85%" stop-color="#d4af5f" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#d4af5f" stop-opacity="0"/>
  </radialGradient>
`;
svg.appendChild(defs);

const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);

// ═════════ 0) 远景模糊层（背景节点+连线） ═════════
const farNodes = nodes.filter(n => n.far);
const farIds = new Set(farNodes.map(n => n.id));
const farEdges = edges.filter(([a, b]) => farIds.has(a) || farIds.has(b));

const farGroup = el('g', { filter: 'url(#blurFar)', opacity: '0.4' });
// 远景连线
farEdges.forEach(([a, b, t]) => {
  const A = nodeById[a], B = nodeById[b];
  const s = edgeStyle[t];
  const path = el('path', {
    d: bezierPath(A.x, A.y, B.x, B.y, 0.15),
    stroke: s.color, 'stroke-width': s.width * 0.7,
    'stroke-linecap': 'round', fill: 'none',
    opacity: s.opacity * 0.5,
  });
  if (s.dash !== 'none') path.setAttribute('stroke-dasharray', s.dash);
  farGroup.appendChild(path);
});
// 远景节点
farNodes.forEach(n => {
  farGroup.appendChild(el('circle', {
    cx: n.x, cy: n.y, r: n.r,
    fill: 'url(#nodeBlue)', opacity: 0.5,
  }));
});
svg.appendChild(farGroup);

// ═════════ 1) 中心脉冲光圈 ═════════
const pulseRing = el('circle', {
  cx: nodes[0].x, cy: nodes[0].y, r: 120,
  fill: 'url(#pulseRing)',
});
svg.appendChild(pulseRing);

// ═════════ 2) 发光光晕（底层） ═════════
nodes.filter(n => n.glow).forEach(n => {
  const halo = el('circle', {
    cx: n.x, cy: n.y, r: n.r * 3.2,
    fill: n.type === 'hex' ? 'url(#haloGold)' : 'url(#halo)',
  });
  svg.appendChild(halo);
});

// ═════════ 3) 连线（贝塞尔曲线） ═════════
const nearEdges = edges.filter(([a, b]) => !farIds.has(a) || !farIds.has(b));
nearEdges.forEach(([a, b, t]) => {
  const A = nodeById[a], B = nodeById[b];
  const s = edgeStyle[t];
  const path = el('path', {
    d: bezierPath(A.x, A.y, B.x, B.y, 0.12),
    stroke: s.color, 'stroke-width': s.width,
    'stroke-linecap': 'round', fill: 'none',
    opacity: s.opacity,
  });
  if (s.dash !== 'none') path.setAttribute('stroke-dasharray', s.dash);
  svg.appendChild(path);
});

// ═════════ 4) 节点（带立体高光） ═════════
function polygonPoints(cx, cy, r, sides, rotDeg) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const a = (Math.PI * 2 * i) / sides - Math.PI / 2 + (rotDeg * Math.PI) / 180;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
  }
  return pts.join(' ');
}

// 先画非远景节点
nodes.filter(n => !n.far).forEach(n => {
  const isRoot = !!n.root;
  const fill = isRoot ? 'url(#nodeGold)' : 'url(#nodeBlue)';
  const strokeCol = isRoot ? 'url(#strokeGold)' : 'url(#strokeBlue)';

  if (n.type === 'dot') {
    svg.appendChild(el('circle', {
      cx: n.x, cy: n.y, r: n.r,
      fill: '#cfe8fb', opacity: 0.7,
    }));
    return;
  }

  if (n.type === 'hex') {
    svg.appendChild(el('polygon', {
      points: polygonPoints(n.x, n.y, n.r, 6, 0),
      fill, stroke: strokeCol, 'stroke-width': isRoot ? 3.5 : 2.4,
      'stroke-linejoin': 'round',
    }));
  } else {
    svg.appendChild(el('circle', {
      cx: n.x, cy: n.y, r: n.r,
      fill, stroke: strokeCol, 'stroke-width': 2.4,
    }));
  }

  // 立体高光（偏左上）
  const hl = el('ellipse', {
    cx: n.x - n.r * 0.28, cy: n.y - n.r * 0.35,
    rx: n.r * 0.42, ry: n.r * 0.28,
    fill: 'rgba(255,255,255,0.85)', opacity: 0.9,
    transform: `rotate(-30 ${n.x - n.r * 0.28} ${n.y - n.r * 0.35})`,
  });
  svg.appendChild(hl);

  // 微光点
  svg.appendChild(el('circle', {
    cx: n.x - n.r * 0.15, cy: n.y - n.r * 0.2, r: Math.max(2, n.r * 0.12),
    fill: 'rgba(255,255,255,0.95)',
  }));
});

// ═════════ 5) 图例（更精致） ═════════
const legend = [
  { y: 40, t: 'Contains · 包含', color: 'rgba(150,205,250,0.9)', dash: 'none' },
  { y: 76, t: 'Prerequisite · 先修', color: 'rgba(243,217,143,0.95)', dash: '10 7' },
  { y: 112, t: 'Related · 关联', color: 'rgba(255,255,255,0.55)', dash: '3 6' },
];
legend.forEach(item => {
  const g = el('g', {});
  const ln = el('path', {
    d: `M12 ${item.y} Q40 ${item.y - 5} 68 ${item.y}`,
    stroke: item.color, 'stroke-width': 2.5, 'stroke-linecap': 'round', fill: 'none',
  });
  if (item.dash !== 'none') ln.setAttribute('stroke-dasharray', item.dash);
  g.appendChild(ln);
  const tx = el('text', {
    x: 80, y: item.y + 5,
    fill: 'rgba(220,236,251,0.85)', 'font-size': 17,
    'font-family': 'Microsoft YaHei, 微软雅黑, sans-serif',
    'letter-spacing': '1.5',
  });
  tx.textContent = item.t;
  g.appendChild(tx);
  svg.appendChild(g);
});

// ═════════ 6) 尺寸标注线（建筑制图风格） ═════════
const dimStyle = 'rgba(180,214,246,0.25)';
// 顶部水平尺寸
const dimTop = el('g', {});
dimTop.innerHTML = `
  <line x1="200" y1="920" x2="1000" y2="920" stroke="${dimStyle}" stroke-width="1"/>
  <line x1="200" y1="912" x2="200" y2="928" stroke="${dimStyle}" stroke-width="1"/>
  <line x1="1000" y1="912" x2="1000" y2="928" stroke="${dimStyle}" stroke-width="1"/>
  <text x="600" y="935" text-anchor="middle" font-size="13" fill="${dimStyle}"
    font-family="Times New Roman" letter-spacing="2">800 px</text>
`;
svg.appendChild(dimTop);
</script>
